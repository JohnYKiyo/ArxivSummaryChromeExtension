services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8100:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"
    # NOTE: no healthcheck here — the dynamodb-local image is a minimal
    # Java environment without curl/wget. The setup container below waits
    # by polling `aws dynamodb list-tables` until it succeeds.

  dynamodb-setup:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Wait for DynamoDB Local to accept requests
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          echo "[setup] waiting for DynamoDB Local..."
          sleep 1
        done
        echo "[setup] DynamoDB Local is up, creating table..."

        # Create table (idempotent: ignore ResourceInUseException if it already exists)
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name arxiv-translator-jobs \
          --attribute-definitions AttributeName=job_id,AttributeType=S \
          --key-schema AttributeName=job_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          2>/dev/null || echo "[setup] table already exists (skipping)"
        echo "[setup] done"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./docs:/app/docs
    env_file:
      - .env
    environment:
      DYNAMODB_TABLE_NAME: arxiv-translator-jobs
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-1
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend/web
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/web/src:/app/src
      - ./frontend/web/vite.config.ts:/app/vite.config.ts
    environment:
      # Tell Vite's dev-server proxy to forward /api/* to the backend container
      # (service name on the Compose network). The fallback in vite.config.ts
      # uses localhost so `npm run dev` outside Docker still works.
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
